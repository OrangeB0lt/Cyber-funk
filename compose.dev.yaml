# Develop inside Docker, no Node on the host needed (docs/guides/docker.md):
#   docker compose -f compose.dev.yaml up --build     game at http://localhost:5173 (hot reload)
#   docker compose -f compose.dev.yaml run --rm tools    npm run check + the server tests
#   docker compose -f compose.dev.yaml run --rm e2e      Playwright at 360px
# The repo is bind-mounted at /app; node_modules lives in a volume (Linux binaries).
name: cyberfunk-dev

x-env: &env
  DATABASE_URL: postgres://cyberfunk:cyberfunk@db:5432/cyberfunk
  DATABASE_URL_TEST: postgres://cyberfunk:cyberfunk@db:5432/cyberfunk_test
  VITE_POLL: ${VITE_POLL:-}

x-node: &node
  build:
    context: .
    target: dev
  image: cyberfunk-dev:latest
  volumes:
    - .:/app
    - node_modules:/app/node_modules
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: cyberfunk
      POSTGRES_PASSWORD: cyberfunk
      POSTGRES_DB: cyberfunk
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata-dev:/var/lib/postgresql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cyberfunk -d cyberfunk']
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    <<: *node
    command: ['npm', 'run', 'dev:server']
    environment:
      <<: *env
      PORT: '8787'
      LOG_LEVEL: debug
    ports:
      - '8787:8787'

  web:
    <<: *node
    command: ['npm', 'run', 'dev', '--', '--host', '0.0.0.0', '--port', '5173', '--strictPort']
    environment:
      <<: *env
      API_PROXY: http://api:8787
    ports:
      - '5173:5173'

  tools:
    <<: *node
    profiles: [tools]
    environment: *env
    command: ['sh', '-c', 'npm run check && npm run test:server']

  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: [tools]
    # uid 1000 is `node` in the dev image and `ubuntu` here, so both can write node_modules.
    user: '1000:1000'
    working_dir: /app
    ipc: host
    environment:
      HOME: /tmp
      CI: ${CI:-}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    entrypoint: ['/app/docker/dev-entrypoint.sh']
    # Two workers: four Chromiums plus the preview server crowd Docker Desktop's default VM.
    command: ['npx', 'playwright', 'test', '--workers=2']

volumes:
  pgdata-dev:
  node_modules:
