<style>
/* CYBER FUNK — Neon Orleans. Single-theme by design: a CRT in a dark bar.
   Layout: one fixed column (≤520px), topbar / scrolling story / thumb-reach actions. */
:root {
  --bg: #0b0218; --bg2: #140527; --bg3: #1e0a3a; --fg: #f3ecff; --dim: #a893c7; --line: #3a1c63;
  --purple: #b14aff; --green: #39ff88; --gold: #ffc43d; --magenta: #ff2bd6; --cyan: #00e5ff; --red: #ff3b5c;
  --hot: #ff5a2b; --low: #9b5cff; --blue: #3fb6ff; --funk: #39ff88; --sweet: #ff6ad5;
  --font-ui: 'Share Tech Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace;
  --font-logo: 'Monoton', 'Share Tech Mono', ui-monospace, monospace;
  --tap: 48px; --radius: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 17px; line-height: 1.4; overflow: hidden; -webkit-text-size-adjust: 100%; }
#app { position: relative; height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; }
.standalone #app { height: 100dvh; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
#app.size-S { font-size: 15.5px; } #app.size-L { font-size: 19px; }
#app { font-size: 17px; }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50; opacity: .055;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.9) 0 1px, transparent 1px 3px); }
button { font: inherit; color: inherit; }
.btn { display: block; width: 100%; min-height: var(--tap); padding: 10px 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--bg2); color: var(--fg); text-align: left; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; font-size: 1em; line-height: 1.25; }
.btn:active { transform: translateY(1px); filter: brightness(1.15); }
.btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.btn.primary { background: var(--gold); color: #1a0b00; border-color: var(--gold); font-weight: bold; text-align: center; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 48px; padding: 8px 12px; width: auto; display: inline-block; font-size: .92em; }
.btn.wide { width: 100%; text-align: center; }
.btn.disabled { opacity: .45; }
.btn.danger { border-color: var(--red); color: var(--red); }
.btn.gold { border-color: var(--gold); color: var(--gold); }
.btn.hint { border-color: var(--gold); box-shadow: 0 0 10px rgba(255,196,61,.25); }
.btn.sel { border-color: var(--cyan); box-shadow: 0 0 12px rgba(0,229,255,.35); background: var(--bg3); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.row.wrap .btn { margin: 0; }
.dim { color: var(--dim); } .small { font-size: .92em; } .good { color: var(--green); } .bad { color: var(--red); } .gold { color: var(--gold); }
h1, h2, h3, h4 { margin: .4em 0 .3em; text-wrap: balance; line-height: 1.15; }
h2 { font-size: 1.35em; color: var(--gold); text-shadow: 0 0 10px rgba(255,196,61,.45); letter-spacing: .02em; }
h3 { font-size: 1.15em; color: var(--cyan); text-shadow: 0 0 8px rgba(0,229,255,.4); }
h4 { font-size: 1em; color: var(--magenta); text-transform: uppercase; letter-spacing: .08em; margin-top: 1em; }
p { margin: .45em 0; }
.card { background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; margin: 8px 0; }
.card.quest { border-color: rgba(255,196,61,.4); }

/* layout regions */

#actions:empty { display: none; }
.top { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; cursor: pointer; min-height: 40px; }
.top-name { white-space: nowrap; } .top-gold { color: var(--gold); font-weight: bold; white-space: nowrap; }
.top-bars { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.bar { position: relative; height: 16px; border-radius: 8px; background: rgba(255,255,255,.08); overflow: hidden; border: 1px solid rgba(255,255,255,.08); }
.bar i { display: block; height: 100%; background: var(--gold); transition: width .35s ease; }

.bar.heart i { background: linear-gradient(90deg, #ff2bd6, #ff5a2b); } .bar.funk i { background: linear-gradient(90deg, #00e5ff, #3fb6ff); }
.bar.groove i { background: linear-gradient(90deg, #39ff88, #ffc43d); } .bar.groove.full { box-shadow: 0 0 12px var(--gold); } .bar.groove.full i { animation: pulse 1s infinite alternate; }
.bar.ehp i { background: linear-gradient(90deg, #ff3b5c, #ff5a2b); } .bar.xp i { background: var(--purple); } .bar.xp { height: 8px; margin: 6px 0; }

/* grids */

.btn.act { text-align: center; font-weight: bold; letter-spacing: .06em; min-height: 56px; display: flex; align-items: center; justify-content: center; padding: 8px 6px; font-size: .95em; }
.btn.act.solo.ready { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 14px rgba(255,196,61,.5); animation: pulse 1s infinite alternate; }
.blues-btn { margin-bottom: 8px; background: linear-gradient(90deg, var(--blue), var(--purple)); border-color: var(--cyan); color: #fff; box-shadow: 0 0 16px rgba(63,182,255,.6); animation: pulse .9s infinite alternate; }
.menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.menu-grid .btn { text-align: center; }
.title-btns { display: flex; flex-direction: column; gap: 8px; }

/* district & places */
.dname { margin-top: 2px; }
.ambient { color: #dcd1f3; font-style: italic; border-left: 2px solid var(--purple); padding-left: 10px; margin: 8px 0; }
.places { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.btn.place, .btn.option { display: flex; flex-direction: column; gap: 2px; }
.pname { font-weight: bold; color: var(--cyan); } .pdesc { font-size: .84em; color: var(--dim); font-weight: normal; }
.bang { color: var(--gold); font-weight: bold; }
.options { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.notes { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.note { padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); font-size: .85em; }
.note.have { border-color: var(--blue); color: #fff; background: rgba(63,182,255,.18); box-shadow: 0 0 8px rgba(63,182,255,.5); }

/* items, lists */
.item { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); }
.item-info { min-width: 0; flex: 1 1 auto; } .item .btn { flex: none; }
.item.eq { background: rgba(57,255,136,.05); }
.skill { padding: 8px 0; border-bottom: 1px solid var(--line); } .skill.locked { opacity: .5; }
.skill-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0; }
.stat { background: rgba(255,255,255,.04); border-radius: 8px; padding: 6px 8px; display: flex; justify-content: space-between; }
.stat .k { color: var(--dim); font-size: .85em; } .stat .v { font-weight: bold; font-variant-numeric: tabular-nums; }
.tone { display: inline-block; padding: 0 6px; border-radius: 6px; font-size: .78em; font-weight: bold; letter-spacing: .05em; color: #000; vertical-align: middle; }
.t-HOT { background: var(--hot); } .t-LOW { background: var(--low); } .t-BLUE { background: var(--blue); } .t-FUNK { background: var(--funk); } .t-SWEET { background: var(--sweet); }
.tabs { display: flex; gap: 8px; margin: 6px 0; }
.shop-gold { color: var(--gold); margin-bottom: 4px; }
.seg-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.seg { display: flex; gap: 4px; flex-wrap: wrap; }
.seg-btn { min-height: 48px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg2); color: var(--dim); touch-action: manipulation; user-select: none; }
.seg-btn.on { background: var(--gold); color: #1a0b00; border-color: var(--gold); font-weight: bold; }

/* sheets & popups */
#sheet { position: absolute; inset: 0; z-index: 30; background: rgba(5,0,15,.72); display: flex; align-items: flex-end; }
#sheet[hidden], #popup[hidden], #timing[hidden], #topbar[hidden] { display: none; }
.sheet-card { width: 100%; max-height: 90%; background: var(--bg2); border: 1px solid var(--line); border-bottom: 0; border-radius: 16px 16px 0 0; display: flex; flex-direction: column; animation: up .2s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.sheet-head h3 { flex: 1; margin: 0; } .sheet-head .close { min-width: 44px; }
.sheet-body { overflow-y: auto; padding: 10px 14px 16px; min-height: 0; }
.sheet-foot { padding: 10px 14px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
#popup { position: absolute; inset: 0; z-index: 40; background: rgba(5,0,15,.78); display: flex; align-items: center; justify-content: center; padding: 16px; }
.popup-card { width: 100%; max-width: 420px; max-height: 90%; overflow-y: auto; background: var(--bg3); border: 1px solid var(--purple); border-radius: 14px; padding: 14px; box-shadow: 0 0 30px rgba(177,74,255,.4); }
.popup-card h4 { margin-top: 0; color: var(--gold); }
.popup-card .row .btn { flex: 1; text-align: center; }
.levelup h4 { font-size: 1.4em; color: var(--green); text-shadow: 0 0 12px var(--green); }
.newskill { margin: 8px 0; padding: 8px; border-radius: 8px; background: rgba(0,229,255,.08); border: 1px solid rgba(0,229,255,.3); }
#toast { position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(10px); z-index: 45; background: var(--bg3); border: 1px solid var(--gold); color: var(--fg); padding: 8px 14px; border-radius: 999px; font-size: .9em; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: 92%; text-align: center; }
#toast.show { opacity: 1; transform: translateX(-50%); }

/* battle */
.battle { display: flex; flex-direction: column; height: 100%; gap: 8px; }
.enemies { flex: none; display: flex; flex-direction: column; gap: 6px; max-height: 45%; overflow-y: auto; }
.ecard { position: relative; background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 10px; transition: opacity .3s; }
.ecard.boss { border-color: rgba(255,43,214,.5); }
.ecard.dead { opacity: .35; filter: grayscale(1); }
.ecard.active { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,229,255,.35); }
.ecard.targetable { border-color: var(--gold); box-shadow: 0 0 12px rgba(255,196,61,.5); cursor: pointer; animation: pulse .8s infinite alternate; }
.ecard-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.ecard .bar { height: 14px; margin: 4px 0; } .ecard .bar span { line-height: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; min-height: 4px; }
.chip { font-size: .78em; padding: 3px 8px; min-height: 26px; display: inline-flex; align-items: center; border-radius: 999px; border: 1px solid var(--c, var(--dim)); color: var(--c, var(--dim)); background: rgba(0,0,0,.3); cursor: pointer; }
.blog { flex: 1 1 auto; min-height: 64px; display: flex; flex-direction: column; justify-content: flex-end; overflow-y: auto; background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 10px; font-size: .92em; line-height: 1.35; }
.ll.crit { color: var(--gold); } .ll.boss { color: var(--magenta); } .ll.telegraph { color: var(--gold); font-style: italic; } .ll.good { color: var(--green); } .ll.bad { color: var(--red); } .ll.heal { color: var(--sweet); } .ll.you { color: var(--cyan); } .ll.solo { color: var(--gold); font-weight: bold; } .ll.assist { color: #c9b8ff; } .ll.round { color: var(--dim); text-align: center; } .ll.narr { color: #dcd1f3; font-style: italic; }
.pstat { position: relative; flex: none; margin-top: auto; background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 10px; display: flex; flex-direction: column; gap: 4px; }
.pname { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.beat { margin-left: auto; display: flex; gap: 3px; }
.beat i { font-style: normal; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; font-size: .8em; color: var(--dim); }
.beat i.on { background: var(--purple); color: #fff; border-color: var(--purple); } .beat i.four { border-color: var(--gold); } .beat i.four.on { background: var(--gold); color: #000; }
.float { position: absolute; top: 4px; font-weight: bold; font-size: 1.15em; text-shadow: 0 0 6px #000, 0 0 6px #000; pointer-events: none; animation: floatup .9s ease-out forwards; z-index: 5; }
.float.big { font-size: 1.5em; }
@keyframes floatup { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-34px); opacity: 0; } }
.shake { animation: shake .3s; } @keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.flash { animation: flash .4s; } @keyframes flash { 0% { filter: brightness(2.2); } 100% { filter: none; } }
.skilllist { display: flex; flex-direction: column; gap: 6px; max-height: 42vh; overflow-y: auto; margin-bottom: 6px; }
.btn.skillbtn { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; min-height: 52px; }
.sb-name { font-weight: bold; } .sb-fp { color: var(--gold); font-size: .85em; } .sb-desc { grid-column: 1 / -1; font-size: .8em; color: var(--dim); }
.tsel { text-align: center; display: flex; flex-direction: column; gap: 6px; }

/* timing overlay */
#timing { position: absolute; left: 0; right: 0; bottom: 0; height: 48%; z-index: 35; background: var(--bg); border-top: 2px solid var(--cyan); display: flex; align-items: stretch; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.timing { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); max-width: 520px; margin: 0 auto; width: 100%; }
.tlabel { text-align: center; letter-spacing: .12em; color: var(--dim); } .tlabel b { color: var(--gold); text-shadow: 0 0 10px var(--gold); }
.track { position: relative; height: 34px; border-radius: 17px; background: rgba(255,255,255,.07); border: 1px solid var(--line); overflow: hidden; }
.zone { position: absolute; top: 0; bottom: 0; border-radius: 17px; }
.zone.loose { background: rgba(0,229,255,.12); } .zone.pocket { background: rgba(57,255,136,.25); } .zone.one { background: var(--gold); box-shadow: 0 0 16px var(--gold); }
.marker { position: absolute; top: -4px; bottom: -4px; width: 6px; margin-left: -3px; background: #fff; box-shadow: 0 0 10px #fff; border-radius: 3px; left: 0; }
.tresult { text-align: center; font-size: 1.5em; font-weight: bold; min-height: 1.3em; letter-spacing: .08em; text-shadow: 0 0 12px currentColor; }
.tapzone { text-align: center; color: var(--dim); font-size: .85em; letter-spacing: .2em; text-transform: uppercase; }
.timing.auto { justify-content: center; align-items: center; }
.pads { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.pad { aspect-ratio: 1 / 1.3; max-width: 100%; border-radius: 10px; border: 1px solid var(--line); background: var(--bg2); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: .8em; text-align: center; color: var(--dim); transition: transform .1s; }
.pad small { font-size: 1.3em; color: var(--blue); }
.pad.lit { border-color: var(--blue); box-shadow: 0 0 14px var(--blue); background: rgba(63,182,255,.25); color: #fff; transform: scale(1.08); }
.pad.hit { background: rgba(57,255,136,.25); border-color: var(--green); } .pad.perfect { box-shadow: 0 0 18px var(--gold); border-color: var(--gold); }

/* title */
.title { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; position: relative; padding: 24px 0; }
.logo { font-family: var(--font-logo); font-weight: 400; font-size: clamp(2.2rem, 11vw, 3.6rem); letter-spacing: .06em; margin: 0; color: #fff; text-shadow: 0 0 6px #fff, 0 0 18px var(--magenta), 0 0 42px var(--magenta), 0 0 70px var(--purple); animation: flicker 6s infinite; line-height: 1.1; }
.logo.small-logo { font-size: 2rem; animation: none; }
@keyframes flicker { 0%, 93%, 100% { opacity: 1; } 94% { opacity: .75; } 95% { opacity: 1; } 97% { opacity: .85; } 98% { opacity: 1; } }
.sub { color: var(--cyan); letter-spacing: .25em; text-transform: uppercase; font-size: .8em; margin-top: 10px; }
.tag { color: var(--dim); font-style: italic; margin-top: 6px; max-width: 30ch; }
.title-art { display: flex; gap: 28px; font-size: 2em; color: var(--green); text-shadow: 0 0 12px var(--green); margin-top: 10px; }
.title-art span:nth-child(2) { color: var(--gold); text-shadow: 0 0 12px var(--gold); } .title-art span:nth-child(3) { color: var(--magenta); text-shadow: 0 0 12px var(--magenta); }
.version { position: absolute; right: 0; bottom: 0; color: var(--dim); font-size: .75em; padding: 10px; cursor: pointer; }

/* create */
.create { display: flex; flex-direction: column; gap: 8px; }
.btn.card-btn { display: block; }
.btn.card-btn b { font-size: 1.05em; }

/* victory/defeat/credits */
.victory, .defeat, .credits { text-align: center; padding: 12px 0; }
.victory h2 { color: var(--green); text-shadow: 0 0 14px var(--green); font-size: 1.6em; }
.defeat h2 { color: var(--red); text-shadow: 0 0 14px var(--red); font-size: 1.6em; }
.vrow { display: flex; justify-content: space-between; padding: 6px 12px; border-bottom: 1px solid var(--line); }
.roster { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; }
.roster-row { padding: 6px 10px; border-left: 2px solid var(--purple); background: rgba(177,74,255,.06); }
.epilogue { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
.howto p { font-size: .95em; }

/* reduced motion */
#app.reduce-motion *, #app.reduce-motion *::before, #app.reduce-motion *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) { .logo, .bar.groove.full i, .ecard.targetable, .blues-btn, .btn.act.solo.ready { animation: none; } .sheet-card { animation: none; } }
@media (min-width: 560px) { #app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }

</style>
<div id="app">
  <div id="topbar" hidden></div>
  <div id="screen"></div>
  <div id="actions"></div>
  <div id="timing" hidden></div>
  <div id="sheet" hidden></div>
  <div id="popup" hidden></div>
  <div id="toast"></div>
</div>
<script>
/* ============================================================
   CYBER FUNK — data: core tables (tones, statuses, classes, roots)
   ============================================================ */
'use strict';
const VERSION = '1.0.0';

/* ---------- Rewards ---------- */
function battleRewards(b) {
  const s = b.state; const st = derivedStats(s);
  let xp = 0, gold = 0; const drops = [];
  b.enemies.forEach(e => {

    xp += ex; gold += g;
    if (!e.boss && !e.summoned) {

/* ---------- Lexicon-aware text ---------- */
let LEX_RE = null;
function lexRegex() {
  if (LEX_RE) return LEX_RE;
  const keys = Object.keys(GLOSSARY).filter(k => !GLOSSARY[k].noauto).sort((a, b) => b.length - a.length).map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/'/g, "['\u2019]"));

function autoLex(text, seen) {

    seen.add(key);
    const start = m.index + m[1].length;
    if (start > last) out.push({ t: text.slice(last, start) });
    out.push({ t: m[2], lex: key });
    last = start + m[2].length;

}

  const plain = t => { autoLex(t, seen).forEach(p => parts.push(p)); };

    const key = m[1].trim().toLowerCase(); const disp = m[2] || m[1];
    seen.add(key);
    parts.push({ t: disp, lex: GLOSSARY[key] ? key : null });

}

async function mamaRouxTalk() {
  if (!S.flags.metRoux) { S.flags.metRoux = true; }
  const g = { creole: '"Where y\'at, baby? Your mama still making groceries at the Circle Food? Tell her I said hey. Sit down, you lookin\' thin as a po\'boy wrapper."', cajun: '"There\'s my bayou baby. Mais, you want some gumbo? Of course you do. Sit."', yat: '"Where y\'at, dawlin\'! Irish Channel in my kitchen. Sit down before you fall down."', any: '"Where y\'at, baby? Sit down, you lookin\' thin as a po\'boy wrapper. Eat first. Then you can go save the city."' };
  await say('mamaroux', greet('mamaroux', g));
  if (S.main.act === 'treme' && S.main.step === 0) { S.main.step = 1; await say('mamaroux', '"Now listen. The Hush got every corner in Tremé. You can\'t get near Congo Square with them thick like that. Go thin them out. Three good fights on the streets and Captain Hush\'ll come see about you himself."'); return; }
  if (S.quests.redbeans === undefined) { const c = await choose([{ label: '"You need anything, Mama?"' }, { label: '"Just passing through."' }]); if (c === 0) { S.quests.redbeans = 'active'; await say('mamaroux', '"Red beans. Camellia brand, the dry ones. The French Market still carries them if the Hush haven\'t licensed beans yet. Bring me a bag and I\'ll cook you something that\'ll carry you to the Tower and back."'); } else await say('mamaroux', '"Mm-hm. Passing through. Eat something on your way."'); return; }
  const bits = ['"Gus used to sit right there. Same stool. Said my gumbo was the only thing in the city with more layers than his solos."', '"Ti-Jacques fixed that boy\'s horn more times than I can count. Never charged him once. Don\'t tell Ti-Jacques I told you."', '"You tired, baby? The club\'s got chairs. They ain\'t comfortable but they\'re free."', S.notes.length >= 3 ? '"Half the scale. I can feel it in the walls. Keep going."' : '"The Blue Notes. Six of them. Gus said the whole city was just those six notes played different every night."', S.flags.gusFreed ? '"You saw him. Gus. Did he... was he alright? Don\'t answer that. He\'s leading the line. He\'s alright."' : null].filter(Boolean);
  await say('mamaroux', pick(bits));
}
async function odetteTalk() {
  if (!S.flags.metOdette) {
    S.flags.metOdette = true;
    await say('odette', '"So you\'re the one from Tremé. Gus talked about you. Sit down, the first drink\'s on the house and the second one\'s on Metronome because I\'m not paying their license."');
    await say('odette', '"Here\'s the shape of it. Bourbon is the Licensed Entertainment Strip now. Vox Perfecta, android diva, forty feet tall, perfect pitch, zero feeling. Every club on the Strip is wired to a licensing broadcaster in Jackson Square. Kill that signal and the Strip\'s doors open. Then take the main stage and put something real on it."');
    if (S.main.act === 'quarter' && S.main.step === 0) S.main.step = 1;
    await say('odette', '"And when you\'re done with that: my back room runs a Cutting Contest. Three rivals, one after the other, real players. Win it and Sugar sings for you. She\'s been waiting for a band worth following."');
    S.quests.cutting = 'active';
    await say('odette', '"Oh, and if you need Doubloons, sit in with the house band once a day. We pay by how many clams you don\'t play."');
    return;
  }
  const bits = ['"Frenchmen Street was the last place in the city with a real downbeat. I intend to keep it that way."', S.flags.boss_vox_perfecta ? (S.flags.vox === 'reprogrammed' ? '"Vox came by. Sang a ballad, flat as a flounder, and the whole room cried. You did a good thing, cher."' : '"The Strip\'s dark without Vox. Honestly? It\'s quieter. I\'ll take quiet over licensed."') : '"Vox Perfecta can\'t feel a blue note. That\'s not a figure of speech. BLUE tones go right through her."', S.quests.cutting === 'done' ? '"Sugar says you\'re the real thing. Sugar doesn\'t say that."' : '"The Cutting Contest is waiting. Hot Rod plays HOT. Big Mae is all LOW end. Two-Tone honks FUNK with a BLUE chaser."'];
  if (!S.flags.voxHint) { S.flags.voxHint = true; G.bookHint('vox_perfecta'); }
  await say('odette', pick(bits));
}
async function celesteTalk() {
  if (!S.flags.metCeleste) {
    S.flags.metCeleste = true;
    await say('celeste', '"Bienvenue, chéri. In this house the music\'s live and the secrets cost extra. You\'re the one who took the Strip back. Good. Now listen, because Storyville has a worse problem than Metronome."');
    await say('celeste', '"Mr. Ledger. He bought every contract in the district. Musicians, dancers, dealers, the woman who sells flowers on Basin Street. Bought the paper on all of them, and the paper says the music is his. His collectors carry the pages on them. I want those pages. Three of them, and I can read where his vault is."');
    if (S.main.act === 'storyville' && S.main.step === 0) S.main.step = 1;
    await say('celeste', '"Contract Enforcers. Pinstripes, armor plating. Shake them on the street. And chéri, when you have the pages, come see me. My Whispers will tell you where the vault is, for a small fee. Everything here is for a small fee. That\'s how we stay open."');
    return;
  }
  if (S.main.act === 'garden' && S.main.step === 0 && S.flags.contracts === 'burned' && !S.flags.celesteInvite) {
    await say('celeste', '"You want into the Vane ball. Of course you do. Isolde Vane owes this house more than a favor, she owes it a whole winter. I\'ll call it in. Consider it the only thing in the Lantern that\'s ever been free."'); S.flags.celesteInvite = true; await getInvitation('celeste'); return;
  }
  const bits = [S.flags.contracts === 'burned' ? '"The district\'s free. People are singing on Basin Street again. The deluxe rooms are yours whenever you want them, no charge, forever. That\'s the deal and I keep my deals."' : S.flags.contracts === 'kept' ? '"You kept the money. Mm. I don\'t judge, chéri. I just remember." She remembers. The Lantern is a little colder.' : '"Ledger counts everything. Count faster than him. FUNK throws his whole arithmetic off."', '"Theo\'s been at that piano since before the Silence Ordinance. If you find his rolls, you\'ll make an old man cry, and he\'ll hate that, and he\'ll love it."', '"Static? Corner booth. Metronome owns his contract, and it\'s the only one in Storyville I couldn\'t buy back. Maybe you can."'];
  if (!S.flags.ledgerHint) { S.flags.ledgerHint = true; G.bookHint('mr_ledger'); }
  await say('celeste', pick(bits));
}
async function clothildeTalk() {

    S.flags.metClothilde = true;
    await say('clothilde', S.roots === 'cajun' ? '"Mais, come here, mon \'tit. Lafourche? I knew your people. Your grand-père could call a fais do-do out of a dead swamp with that accordion. Sit, sit. Comment ça va?"' : '"Come here, mon \'tit. Traiteur don\'t take money. But if you got some boudin, I won\'t say no."');
    await say('clothilde', '"You hear that hum? That\'s Pump Station 13. Metronome\'s been testing their Click out here where they think nobody\'s listening. The Chrome Wolves were listening. Their alpha, Lucien, the boy with the implant, the signal got in him and turned him into something the old folks got a name for. Rougarou."');
    if (S.main.act === 'bayou' && S.main.step === 1) S.main.step = 2;
    await say('clothilde', '"The pups are out on the trails, feral. Put three of them down gentle and follow the tracks to the station. And mon \'tit: the rougarou runs hot already. Heat is how you reach him."');

    S.quests.herbs = 'active';

  await say('clothilde', pick(bits));
}
async function rosalieTalk() {

    S.flags.metRosalie = true;
    await say('rosalie', '"Come in. Mind the candles. I know who you are. The dead have been talking about you for a month."');
    await say('rosalie', '"Under the oldest tomb, Metronome built what they call the Data Mausoleum. They captured the songs of every musician they ever Muted, and they keep them down there, and they feed them to the Click so it can learn what to erase. Gus is down there. His song, I mean. The rest of him is restless, and I can\'t settle him until it\'s free."');
    if (S.main.act === 'cemetery' && S.main.step === 0) S.main.step = 1;
    await say('rosalie', '"The door takes three Crypt Keys. The Data Wraiths carry them. So do some of the wandering haints, poor things. And when you get down there: the Archivist is a machine that catalogs grief. Give it some. BLUE tones break through its filters."');
    G.bookHint('archivist');
    await say('rosalie', '"And if you have time for the living and the dead both: three haints out in the rows can\'t rest. Hear their stories. Play them a dirge. Fight what\'s left of their pain. Brother Moses has been trying alone, with that banjo, for a year."');

'use strict';

/* ---------- Save ---------- */
function saveGame(manual) {
  if (!S) return false;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); return true; } catch (e) { if (manual) toast('Storage is unavailable here. Use Export Save in Settings.'); return false; }
}
function loadRaw() { try { return localStorage.getItem(SAVE_KEY); } catch (e) { return null; } }
function hasSave() { return !!loadRaw(); }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* unavailable */ } }
function migrate(s) {
  if (!s || typeof s !== 'object' || !CLASSES[s.cls] || !ROOTS[s.roots]) return null;
  const fresh = newState(s.name, s.roots, s.cls, s.settings, s.ngPlus);
  Object.keys(fresh).forEach(k => { if (s[k] === undefined) s[k] = fresh[k]; });
  s.settings = Object.assign(defaultSettings(), s.settings || {});
  if (!s.gear.instrument || !GEAR[s.gear.instrument]) s.gear.instrument = `inst_${s.cls}_pawnshop`;
  ['threads', 'charm', 'mod'].forEach(k => { if (s.gear[k] && !GEAR[s.gear[k]]) s.gear[k] = null; });
  s.level = clamp(Math.round(s.level) || 1, 1, LEVEL_CAP);
  clampVitals(s);
  return s;
}
function loadGame() { const raw = loadRaw(); if (!raw) return null; try { return migrate(JSON.parse(raw)); } catch (e) { return null; } }
function exportSave() { if (!S) return null; try { return 'CF1:' + btoa(unescape(encodeURIComponent(JSON.stringify(S)))); } catch (e) { return null; } }
function importSave(code) {
  if (!code || !code.startsWith('CF1:')) return false;
  try { const s = migrate(JSON.parse(decodeURIComponent(escape(atob(code.slice(4)))))); if (!s) return false; S = s; saveGame(false); return true; } catch (e) { return false; }
}

/* ---------- Audio (optional, synthesized) ---------- */
const SFX = {
  ctx: null, ok: true,
  unlock() { if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; } const AC = window.AudioContext || window.webkitAudioContext; if (!AC) { this.ok = false; return; } this.ctx = new AC(); },
  on() { return this.ok && this.ctx && (!S || S.settings.sound); },
  tone(freq, dur, type, vol, when, slide) {

  },
  noise(dur, vol) { if (!this.on()) return; const c = this.ctx; const n = c.sampleRate * dur; const buf = c.createBuffer(1, n, c.sampleRate); const d = buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n); const src = c.createBufferSource(); src.buffer = buf; const g = c.createGain(); g.gain.value = vol || 0.15; const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1800; src.connect(f); f.connect(g); g.connect(c.destination); src.start(); },
  stab(cls) {

    if (cls === 'snare') { this.noise(0.12, 0.2); return; } if (cls === 'bassdrum') { this.tone(110, 0.25, 'sine', 0.3, null, 45); return; }

  },
  hit(toneId) { const f = { HOT: 660, LOW: 110, BLUE: 392, FUNK: 294, SWEET: 784 }[toneId] || 440; this.tone(f, 0.09, toneId === 'LOW' ? 'sine' : 'square', 0.07, null, f * 0.7); },
  crit() { this.noise(0.08, 0.2); this.tone(880, 0.14, 'sawtooth', 0.1, null, 440); },
  coin() { this.tone(1200, 0.08, 'sine', 0.08); this.tone(1800, 0.12, 'sine', 0.06, this.ctx ? this.ctx.currentTime + 0.07 : null); },
  tap(result) { const f = { one: 1047, pocket: 784, loose: 523, clams: 196 }[result] || 440; this.tone(f, result === 'clams' ? 0.25 : 0.1, result === 'clams' ? 'sawtooth' : 'sine', 0.1, null, result === 'clams' ? 140 : null); },
  note(freq, dur) { this.tone(freq, dur || 0.4, 'triangle', 0.14); this.tone(freq * 2, (dur || 0.4) * 0.8, 'sine', 0.04); },
  levelUp() { if (!this.on()) return; const t0 = this.ctx.currentTime; [261.63, 311.13, 349.23, 369.99, 392, 466.16, 523.25].forEach((f, i) => this.tone(f, 0.16, 'triangle', 0.12, t0 + i * 0.11)); },
};

    <h4>Six actions</h4><p><b>RIFF</b> is your basic attack (+2 Funk, +20 Groove). <b>PLAY</b> spends Funk on a skill. <b>SOLO</b> is your ultimate at 100 Groove. <b>VAMP</b> halves damage until your next turn and restores 15% Funk. <b>BAG</b> uses an item. <b>SPLIT</b> runs (never from bosses or elites).</p>

    <h4>Tones & weaknesses</h4><p>Every attack has a tone: <span class="tone t-HOT">HOT</span> <span class="tone t-LOW">LOW</span> <span class="tone t-BLUE">BLUE</span> <span class="tone t-FUNK">FUNK</span>. Every enemy has a weakness (×1.5) and usually a resistance (×0.5). Metronome's machines are usually weak to FUNK. Tone tapes and beads change your next attack's tone. The Blue Book remembers what you learn.</p>
    <h4>Groove</h4><p>Builds from RIFF (+20), any skill (+10), hitting a weakness (+10), ON THE ONE (+10), VAMP (+10), and taking damage (+5). At 100, SOLO.</p>
    <h4>Statuses</h4><p>Small chips with turn counters. Tap one to read it.</p>
    <h4>Save</h4><p>Autosaves when you enter a district, after every fight, and before every boss. Save by hand at the Lagniappe club. Export a save code in Settings so progress is never trapped.</p>
  </div>`;
  openSheet('How to Play', html, {}, { foot: thenStart ? btn('go', 'Walk the dirge ▸', 'primary wide') : '' });
