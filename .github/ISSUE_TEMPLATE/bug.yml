name: Bug report
description: Something in the game behaves wrongly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Game version (title screen)
  - type: input
    id: seed
    attributes:
      label: Seed (Dev menu shows it), if known
  - type: textarea
    id: save
    attributes:
      label: Save code
      description: Settings → Export Save, paste the CF2:… code. It lets us load your exact game.
      render: text
  - type: input
    id: device
    attributes:
      label: Device and browser
