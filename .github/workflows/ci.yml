# Every push, on every branch: types, lint, formatting, layer rules, unit + integration + baseline
# tests (the completeness tests, the crawler, combat coverage, the playthrough), build, e2e, the
# server against PostgreSQL, and the Docker stack end to end. A pull request shows the result of its
# branch's latest push. Run it by hand from the Actions tab with "Run workflow".
name: CI
on:
  push:
    branches: ['**']
  workflow_dispatch:
# A newer push to the same branch cancels the run in progress (except on main, where every run counts).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run depcruise
      - run: npm test
      - run: npm run build
      - run: npm run build:server

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cyberfunk
          POSTGRES_PASSWORD: cyberfunk
          POSTGRES_DB: cyberfunk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cyberfunk -d cyberfunk_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL_TEST: postgres://cyberfunk:cyberfunk@localhost:5432/cyberfunk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:server

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  stack:
    runs-on: ubuntu-latest
    needs: [check, server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: docker compose up --build -d --wait
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          E2E_STACK_URL: https://localhost:8443
      - if: failure()
        run: docker compose logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-stack
          path: playwright-report/
      - if: always()
        run: docker compose down -v
