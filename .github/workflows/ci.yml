# Every push and PR: types, lint, layer rules, unit + integration + parity tests, build, e2e,
# the server against PostgreSQL, and the Docker stack end to end.
name: CI
on:
  push:
    branches: [main, 'refactor/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run depcruise
      - run: npm test
      - run: npm run parity:coverage
      - run: npm run build
      - run: npm run build:server

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cyberfunk
          POSTGRES_PASSWORD: cyberfunk
          POSTGRES_DB: cyberfunk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cyberfunk -d cyberfunk_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL_TEST: postgres://cyberfunk:cyberfunk@localhost:5432/cyberfunk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:server

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  stack:
    runs-on: ubuntu-latest
    needs: [check, server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: docker compose up --build -d --wait
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          E2E_STACK_URL: http://localhost:8080
      - if: failure()
        run: docker compose logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-stack
          path: playwright-report/
      - if: always()
        run: docker compose down -v
