# Run it all: the game and its cloud-save API (app) plus PostgreSQL (db).
#   docker compose up --build        then open http://localhost:8080
# Settings come from .env (copy .env.example). The defaults are for a local machine only.
# Developing? Use compose.dev.yaml instead (hot reload). See docs/guides/docker.md.
name: cyberfunk

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cyberfunk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cyberfunk}
      POSTGRES_DB: ${POSTGRES_DB:-cyberfunk}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      target: runtime
    image: cyberfunk:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cyberfunk}:${POSTGRES_PASSWORD:-cyberfunk}@db:5432/${POSTGRES_DB:-cyberfunk}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - '${APP_PORT:-8080}:8080'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
