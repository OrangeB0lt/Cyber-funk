# Run it all: the game and its cloud-save API (app), PostgreSQL (db), and Caddy for HTTPS (caddy).
#   docker compose up --build        then open https://localhost:8443
# Settings come from .env (copy .env.example). The defaults are for a local machine only.
# Developing? Use compose.dev.yaml instead (hot reload). See docs/guides/docker.md.
name: cyberfunk

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cyberfunk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cyberfunk}
      POSTGRES_DB: ${POSTGRES_DB:-cyberfunk}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      target: runtime
    image: cyberfunk:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cyberfunk}:${POSTGRES_PASSWORD:-cyberfunk}@db:5432/${POSTGRES_DB:-cyberfunk}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Behind Caddy: rate limits use the client's address from X-Forwarded-For.
      TRUST_PROXY: ${TRUST_PROXY:-true}
    # Reached only through Caddy.
    expose:
      - '8080'
    depends_on:
      db:
        condition: service_healthy

  # HTTPS (docker/caddy/Caddyfile). Its certificates and local CA live in the caddy_data volume.
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      HTTP_PORT: ${HTTP_PORT:-8080}
      HTTPS_PORT: ${HTTPS_PORT:-8443}
    ports:
      - '${HTTP_PORT:-8080}:${HTTP_PORT:-8080}'
      - '${HTTPS_PORT:-8443}:${HTTPS_PORT:-8443}'
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
